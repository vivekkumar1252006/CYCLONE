app = "cycloneguard-api"
primary_region = "sin"

[build]
  dockerfile = "docker/backend.Dockerfile"

[env]
  POSTGRES_DB = "cycloneguard"
  POSTGRES_USER = "cycloneguard"

[[services]]
  protocol = "tcp"
  internal_port = 8000
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 800

[checks]
  [checks.alive]
    type = "http"
    interval = "10s"
    timeout = "5s"
    grace_period = "5s"
    method = "GET"
    path = "/api/health"
